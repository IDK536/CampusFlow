name: campusflow

x-api: &api
  image: campusflow-backend:local
  build:
    context: ./Backend
  environment:
    ASPNETCORE_HTTP_PORTS: "8080"
    ConnectionStrings__CampusFlow: "Host=db;Port=5432;Database=${POSTGRES_DB:-campusflow};Username=${POSTGRES_USER:-campusflow};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    Jwt__Key: ${Jwt__Key:?Set Jwt__Key in .env}
    Jwt__Issuer: ${Jwt__Issuer:-CampusFlow}
    Jwt__Audience: ${Jwt__Audience:-CampusFlowClient}
    Jwt__AccessTokenMinutes: ${Jwt__AccessTokenMinutes:-60}
    Jwt__RefreshTokenDays: ${Jwt__RefreshTokenDays:-7}
    Auth__CookieSecure: "false"
    Auth__AllowedOrigins__0: ${Auth__AllowedOrigins__0:-http://localhost:3000}
    Auth__AllowedOrigins__1: ${Auth__AllowedOrigins__1:-http://localhost:5173}
    Auth__AllowedOrigins__2: ${Auth__AllowedOrigins__2:-http://localhost:4173}
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campusflow}
      POSTGRES_USER: ${POSTGRES_USER:-campusflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  init:
    <<: *api
    command: ["--seed"]
    profiles: ["tools"]
    restart: "no"

  backend:
    <<: *api
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    restart: unless-stopped

  client:
    build:
      context: ${CLIENT_BUILD_CONTEXT:-./client}
      args:
        VITE_USE_MOCK: "false"
    environment:
      API_UPSTREAM: http://backend:8080
    ports:
      - "127.0.0.1:${CLIENT_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
