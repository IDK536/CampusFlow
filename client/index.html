<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4329e0" />
    <meta name="description" content="CampusFlow — поиск свободных аудиторий и бронирование слотов" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>CampusFlow</title>
    <script>
      // Тема ставится до загрузки приложения, чтобы не было вспышки светлого экрана.
      ;(function () {
        var pref = 'system'
        try {
          pref = localStorage.getItem('campusflow.theme') || 'system'
        } catch (e) {}
        var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        var theme = pref === 'light' || pref === 'dark' || pref === 'amoled' ? pref : dark ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        var colors = { light: '#4329e0', dark: '#2b1aa6', amoled: '#000000' }
        document.querySelector('meta[name="theme-color"]').setAttribute('content', colors[theme])
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
