name: campusflow

x-backend: &backend
  build: ./Backend
  env_file:
    - ./Backend/.env
  environment:
    ConnectionStrings__CampusFlow: "Host=db;Port=5432;Database=campusflow;Username=campusflow;Password=campusflow-local-db"
    Auth__AllowedOrigins__3: "http://localhost:3008"
    Auth__AllowedOrigins__4: "http://127.0.0.1:3008"
    Auth__AllowedOrigins__5: "http://94.41.18.199:3008"
    Auth__AllowedOrigins__6: "http://192.168.0.80:3008"

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: campusflow
      POSTGRES_USER: campusflow
      POSTGRES_PASSWORD: campusflow-local-db
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "campusflow", "-d", "campusflow"]
      interval: 3s
      timeout: 5s
      retries: 15

  init:
    <<: *backend
    profiles: [tools]
    command: ["--seed"]
    depends_on:
      db:
        condition: service_healthy

  backend:
    <<: *backend
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./client
      args:
        VITE_USE_MOCK: "false"
    environment:
      API_UPSTREAM: http://backend:8080
    depends_on:
      - backend
    ports:
      - "3008:80"

volumes:
  postgres_data:
